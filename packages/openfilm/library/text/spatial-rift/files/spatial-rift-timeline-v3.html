(()=>{'use strict';const canvas=document.querySelector('#fx'),ctx=canvas.getContext('2d',{alpha:true});const node=document.querySelector('.t');const txtCanvas=document.createElement('canvas'),tx=txtCanvas.getContext('2d');const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,v)=>{let t=clamp((v-a)/(b-a));return t*t*(3-2*t)},fract=v=>v-Math.floor(v);const hash=(a,b=0,s=0)=>fract(Math.sin(a*127.1+b*311.7+s*74.7)*43758.5453123);let P={text:'SPATIAL RIFT',total:6.6,entry:2.4,exit:2.4,seed:37,glow:1,opening:1,particles:1,hue:260,textSize:1,font:'Georgia',color:'#dde5ff',intensity:1,shadow:.28,outline:.35,softness:1.35};let now=0,lastKey='';let grainCache=null,grainKey='';const tone=(l,a=1,s=88,offset=0)=>`hsla(${((P.hue+offset)%360+360)%360},${s}%,${l}%,${clamp(a)})`;const rgba=(r,g,b,a)=>`rgba(${r},${g},${b},${clamp(a)})`;function resize(){let d=Math.min(2,window.devicePixelRatio||1),w=Math.max(2,Math.round(canvas.clientWidth*d)),h=Math.max(2,Math.round(canvas.clientHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;lastKey=''}}

function prepText(W,H){
 let key=[W,H,P.text,P.font,P.textSize,P.hue,P.shadow,P.outline,P.softness].join('|');if(key===lastKey)return;lastKey=key;

function text3d(W,H,p){if(p<=0)return;prepText(W,H);

function frame(time){resize();const W=canvas.width,H=canvas.height,T=Math.max(.001,P.total),exit=Math.min(Math.max(0,P.exit),T),entry=Math.min(Math.max(0,P.entry),T-exit),hold=Math.max(0,T-entry-exit);now=clamp(Number(time)||0,0,T);ctx.clearRect(0,0,W,H);let entering=entry>0&&now<entry,holding=now>=entry&&now<T-exit,exiting=!entering&&!holding;let q=entering?now/entry:exiting?(exit>0?(now-(T-exit))/exit:1):0;let textProgress=entering?smooth(.23,.79,q):holding?1:1-smooth(.22,.79,q);let crack=entering?smooth(.015,.19,q):exiting?smooth(.035,.22,q):0;let open=entering?smooth(.14,.41,q)*(1-smooth(.72,.97,q)):exiting?smooth(.11,.37,q)*(1-smooth(.78,.99,q)):0;let visible=entering?(1-smooth(.84,1,q)):exiting?(1-smooth(.85,1,q)):0;

}
function setParams(q){const vars={entry:'--rift-entry',exit:'--rift-exit',seed:'--rift-seed',glow:'--rift-glow',opening:'--rift-opening',particles:'--rift-particles',color:'--rift-color',textSize:'--rift-text-size',shadow:'--rift-shadow',outline:'--rift-outline',softness:'--rift-softness'};if(q.text!==undefined)node.textContent=String(q.text);if(q.clipLength!==undefined)document.documentElement.style.setProperty('--clip-length',String(q.clipLength)+'s');for(const [key,css] of Object.entries(vars))if(q[key]!==undefined)document.documentElement.style.setProperty(css,String(q[key]));window.film.frame(now)}
const read=(key,def)=>{const val=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(key));return Number.isFinite(val)?val:def};
function colorHue(raw){let color=String(raw||'').trim();let m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(color);if(!m)return 260;let h=m[1];if(h.length===3)h=[...h].map(c=>c+c).join('');let rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255),max=Math.max(...rgb),min=Math.min(...rgb),d=max-min;if(d<1e-6)return 260;let n=max===rgb[0]?((rgb[1]-rgb[2])/d)%6:max===rgb[1]?(rgb[2]-rgb[0])/d+2:(rgb[0]-rgb[1])/d+4;return ((n*60)%360+360)%360}
