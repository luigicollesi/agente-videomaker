<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { --clip-length:10s; --text3d-depth:.14; --text3d-color:#dae9ff; --text3d-in:1; --text3d-out:1; --text3d-events:'[]'; }
html,body { margin:0;width:100%;height:100%;overflow:hidden;background:transparent; }
body { display:grid;place-items:center; }
canvas { width:100%;height:100%;display:block; }
.t { position:absolute;opacity:0;pointer-events:none; }
</style>
</head>
<body>
<span class="t">OPENFILM</span><canvas id="scene" width="960" height="540"></canvas>
<script type="module">
import { createText3D } from './component.js';
const component = createText3D({
  canvas: document.getElementById('scene'),
  element: document.querySelector('.t'),
  root: document.documentElement
});
window.film = { frame: async t => (await component).frame(t), ready: component, frameReadsOverrides:true };
</script>
</body>
</html>
