<!doctype html>
<html><head><meta charset="utf-8"><style>
:root { --clip-length:10s; --text3d-color:#dae9ff; --text3d-depth:0.15; --text3d-rotation-x:0deg; --text3d-rotation-y:0deg; --text3d-font:default; --text3d-size:0.43; --text3d-spacing:0; --text3d-align:center; }
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas {display:block;width:100%;height:100%;pointer-events:none}.t{position:absolute;opacity:0;pointer-events:none}
</style></head><body><span class="t">TEXT 3D</span><canvas id="scene" width="960" height="540"></canvas>
<script type="module">
import {createText3D} from './component.js';
const ready=createText3D({canvas:document.querySelector('canvas'),element:document.querySelector('.t'),root:document.documentElement});
window.film={ready,frame:async t=>(await ready).frame(t),frameReadsOverrides:true};
window.__text3dComponent=ready;
ready.then(component=>{window.__text3dHitTest=(x,y)=>component.hitTest(x,y)});
</script></body></html>
