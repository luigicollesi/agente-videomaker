name: Media MCP regression tests

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src/media-mcp*.mjs"
      - "apps/desktop/src/film-mcp-worker.mjs"
      - "apps/desktop/src/mcp/**"
      - "packages/openfilm/src/clip-motion.mjs"
      - "packages/openfilm/src/text3d-cli.mjs"
      - "packages/openfilm/studio/server/text3d/**"
      - "packages/openfilm/studio/server/captions.mjs"
      - "packages/openfilm/studio/server/caption-tracks.mjs"
      - "packages/openfilm/src/captions.mjs"
      - "packages/openfilm/studio/server/film-subtitle.mjs"
      - "packages/openfilm/library/catalogs/motions.json"
      - "packages/openfilm/manual/media/scripts/reverse-video.py"
      - "packages/music-analyzer/**"
      - "packages/openfilm/package.json"
      - "packages/openfilm/studio/server/canvas.mjs"
      - "packages/openfilm/src/library-search.mjs"
      - "apps/desktop/scripts/release.mjs"
      - "apps/desktop/src/agents.mjs"
      - "apps/desktop/src/pi-agent.mjs"
      - "apps/desktop/src/pi-mcp-bridge.mjs"
      - "apps/desktop/src/pi-mcp-bridge.test.mjs"
      - "apps/desktop/src/agent-prompt.md"
      - ".github/workflows/media-mcp.yml"
  pull_request:
    paths:
      - "apps/desktop/src/media-mcp*.mjs"
      - "apps/desktop/src/film-mcp-worker.mjs"
      - "apps/desktop/src/mcp/**"
      - "packages/openfilm/src/clip-motion.mjs"
      - "packages/openfilm/src/text3d-cli.mjs"
      - "packages/openfilm/studio/server/text3d/**"
      - "packages/openfilm/studio/server/captions.mjs"
      - "packages/openfilm/studio/server/caption-tracks.mjs"
      - "packages/openfilm/src/captions.mjs"
      - "packages/openfilm/studio/server/film-subtitle.mjs"
      - "packages/openfilm/library/catalogs/motions.json"
      - "packages/openfilm/manual/media/scripts/reverse-video.py"
      - "packages/music-analyzer/**"
      - "packages/openfilm/package.json"
      - "packages/openfilm/studio/server/canvas.mjs"
      - "packages/openfilm/src/library-search.mjs"
      - "apps/desktop/scripts/release.mjs"
      - "apps/desktop/src/agents.mjs"
      - "apps/desktop/src/pi-agent.mjs"
      - "apps/desktop/src/pi-mcp-bridge.mjs"
      - "apps/desktop/src/pi-mcp-bridge.test.mjs"
      - "apps/desktop/src/agent-prompt.md"
      - ".github/workflows/media-mcp.yml"
  workflow_dispatch:

jobs:
  mcp-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check MCP server and worker syntax
        run: >-
          node --check apps/desktop/src/media-mcp.mjs
      - name: Check worker syntax
        run: node --check apps/desktop/src/film-mcp-worker.mjs
      - name: Check Pi MCP bridge and agent syntax
        run: |
          node --check apps/desktop/src/pi-mcp-bridge.mjs
          node --check apps/desktop/src/pi-agent.mjs
      - name: Check advanced music options
        run: node --check apps/desktop/src/mcp/music-options.mjs
      - name: Check Text3D helper syntax
        run: node --check apps/desktop/src/mcp/text3d-safety.mjs
      - name: MCP protocol, timeline, runtime and locking tests
        run: >-
          node --test
          apps/desktop/src/media-mcp.test.mjs
          apps/desktop/src/media-mcp.batch.test.mjs
          apps/desktop/src/media-mcp.captions-motion.test.mjs
          apps/desktop/src/media-mcp.captions.integration.test.mjs
          apps/desktop/src/media-mcp.text3d.test.mjs
          apps/desktop/src/media-mcp.timeline.test.mjs
          apps/desktop/src/media-mcp.runtime.test.mjs
          apps/desktop/src/media-mcp.lock.test.mjs
          apps/desktop/src/media-mcp.discovery.test.mjs
          apps/desktop/src/media-mcp.canvas-captions.test.mjs
          apps/desktop/src/media-mcp.film.test.mjs
          apps/desktop/src/media-mcp.music-options.test.mjs
          apps/desktop/src/media-mcp.music-advanced.test.mjs
          apps/desktop/src/pi-mcp-bridge.test.mjs
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install offline Music Analyzer
        if: runner.os == 'Linux'
        run: python -m pip install -e packages/music-analyzer
      - name: Real FFmpeg and music analysis smoke test
        if: runner.os == 'Linux'
        env:
          VIDEOMAKER_MCP_INTEGRATION: "1"
        run: node --test apps/desktop/src/media-mcp.real.test.mjs
