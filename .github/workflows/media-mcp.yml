name: Media MCP regression tests

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src/media-mcp*.mjs"
      - "packages/openfilm/manual/media/scripts/reverse-video.py"
      - "packages/music-analyzer/**"
      - "packages/openfilm/package.json"
      - "apps/desktop/scripts/release.mjs"
      - ".github/workflows/media-mcp.yml"
  pull_request:
    paths:
      - "apps/desktop/src/media-mcp*.mjs"
      - "packages/openfilm/manual/media/scripts/reverse-video.py"
      - "packages/music-analyzer/**"
      - "packages/openfilm/package.json"
      - "apps/desktop/scripts/release.mjs"
      - ".github/workflows/media-mcp.yml"
  workflow_dispatch:

jobs:
  mcp-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check MCP server syntax
        run: node --check apps/desktop/src/media-mcp.mjs
      - name: MCP protocol, timeline, runtime and locking tests
        run: >-
          node --test
          apps/desktop/src/media-mcp.test.mjs
          apps/desktop/src/media-mcp.timeline.test.mjs
          apps/desktop/src/media-mcp.runtime.test.mjs
          apps/desktop/src/media-mcp.lock.test.mjs
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install offline Music Analyzer
        if: runner.os == 'Linux'
        run: python -m pip install -e packages/music-analyzer
      - name: Real FFmpeg and music analysis smoke test
        if: runner.os == 'Linux'
        env:
          VIDEOMAKER_MCP_INTEGRATION: "1"
        run: node --test apps/desktop/src/media-mcp.real.test.mjs
