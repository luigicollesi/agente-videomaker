name: Music Analyzer Python

on:
  pull_request:
    paths:
      - "packages/music-analyzer/**"
      - ".github/workflows/music-analyzer.yml"
  push:
    paths:
      - "packages/music-analyzer/**"
      - ".github/workflows/music-analyzer.yml"

jobs:
  decoder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python package
        working-directory: packages/music-analyzer
        run: python -m pip install -e '.[test]'
      - name: Run tests
        working-directory: packages/music-analyzer
        run: python -m pytest -q
